# Licensing of every file in the repository, checked by `reuse lint` (ADR 0015).
# A file no annotation covers fails the check: a new top-level path, or a vendored file, needs its own entry.
version = 1

[[annotations]]
path = [
    ".cargo/**",
    ".github/**",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "Cargo.lock",
    "Cargo.toml",
    "README.md",
    "REUSE.toml",
    "SECURITY.md",
    "clippy.toml",
    "crates/**",
    "deny.toml",
    "docs/**",
    "examples/**",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "scripts/**",
    "tests/**",
    "xtask/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The nsh-m3e contributors"
SPDX-License-Identifier = "MPL-2.0"

# Generated by `cargo xtask gen-tokens` from the androidx files below (Apache-2.0), so they carry both licenses.
[[annotations]]
path = "crates/nsh-m3e/src/tokens/androidx/**"
precedence = "override"
SPDX-FileCopyrightText = ["The nsh-m3e contributors", "The Android Open Source Project"]
SPDX-License-Identifier = "MPL-2.0 AND Apache-2.0"

# Generated by `cargo xtask gen-icons` from the Material Symbols below (Apache-2.0), so they carry both licenses.
[[annotations]]
path = "crates/nsh-m3e/src/material_symbols/**"
precedence = "override"
SPDX-FileCopyrightText = ["The nsh-m3e contributors", "Google"]
SPDX-License-Identifier = "MPL-2.0 AND Apache-2.0"

# Vendored sources keep their own license (ADR 0007); their provenance files say where they come from.
[[annotations]]
path = ["reference/README.md", ".claude/skills/PROVENANCE.md"]
precedence = "override"
SPDX-FileCopyrightText = "The nsh-m3e contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["reference/androidx-material3-tokens/**", "reference/androidx-material3-components/**"]
precedence = "override"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "reference/material-symbols/**"
precedence = "override"
SPDX-FileCopyrightText = "Google"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "reference/material-web/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "reference/rust/google-rust-style-guide.md"
precedence = "override"
SPDX-FileCopyrightText = "Google"
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = [".claude/skills/nsh/**", ".claude/skills/nsh-design-guides/**"]
precedence = "override"
SPDX-FileCopyrightText = "Longbridge"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".claude/skills/rust-best-practices/**"
precedence = "override"
SPDX-FileCopyrightText = "Apollo GraphQL"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".claude/skills/rust-coding-guidelines/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of https://github.com/actionbook/rust-skills"
SPDX-License-Identifier = "MIT"

# The Contributor Covenant 3.0, with this project's reporting address filled in.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

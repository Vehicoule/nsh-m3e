name: Visual checks

# ADR 0013: the catalog's screenshots on NSH's real hosts, and the checks of their known pixels. `nsh test` opens
# `examples/catalog` on a host and saves its screenshots (`examples/catalog/button.test.tsx`); `visual-checks`
# reads the pixels the tokens give (`tests/visual`). The screenshots are kept as artifacts, for review.
#
# Linux (GTK under Xvfb) and the web (headless Chrome), as NSH's own CI runs them on the same runners
# (`.github/workflows/linux.yml` and `rust-app.yml` in NSH at the pinned revision).

on:
  pull_request:
  push:
    branches: [main]
  # To run the checks by hand on any branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run on the older commit, which nobody needs any more. Each run on `main`
# has a group of its own, so a merge never cancels the run of the merge before it: every commit on `main` is
# checked, and its caches are saved.
concurrency:
  group: visual-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The hosts are large: without debug information they build faster and fit the runner's disk. It changes no
  # code that runs.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  visual:
    name: visual (${{ matrix.host }})
    runs-on: ubuntu-24.04
    env:
      # As NSH's CI installs them (see the install step), listed once for the cache key and the install.
      APT_PACKAGES: >-
        clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        xvfb
    strategy:
      fail-fast: false
      matrix:
        host: [linux, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: what the pull request changes.
          fetch-depth: 2
      # The job runs on every pull request, so that its check can be required, but it does its work only when the
      # pull request changes what the screenshots show; otherwise it passes at once. On `main` and by hand, always.
      # `--no-renames` lists a moved file by its old path too, so moving one out of these paths still counts.
      - name: See whether the pull request changes what the screenshots show
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only HEAD^1 HEAD | grep -E \
              '^(crates/|examples/|tests/visual/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/visual\.yml$)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the screenshots show changes: no screenshot to take."
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi
      # apt's downloads are kept between runs: Azure's Ubuntu mirror sometimes serves them at about 50 kB/s, and two
      # runs of 2026-11-06 spent 32 minutes fetching these packages' 102 MB. With the downloads restored, apt fetches
      # only the indexes and what changed. The key is the list of files apt would download, versions included.
      - name: List the packages apt will download
        id: apt
        if: steps.changes.outputs.visual == 'true'
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/apt-empty/partial"
          # Every file apt would download into an empty archive directory, with its version in its name: the key
          # changes as soon as one package does.
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -qq -y --print-uris -o Dir::Cache::Archives="$RUNNER_TEMP/apt-empty" $APT_PACKAGES \
            > "$RUNNER_TEMP/apt-uris"
          cat "$RUNNER_TEMP/apt-uris"
          echo "hash=$(sha256sum "$RUNNER_TEMP/apt-uris" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore apt's downloaded packages
        if: steps.changes.outputs.visual == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-visual-${{ steps.apt.outputs.hash }}
          # A new package version restores the last entry, downloads only what changed, and saves a new entry.
          restore-keys: apt-visual-
      # As NSH's CI installs them: clang for QuickJS in the `nsh` CLI, GTK 4, WebKitGTK and GStreamer for the Linux
      # host (the web runtime's build links the app's Linux entry too), LLVM for the web runtime's C code, Xvfb for
      # a display.
      - name: Install clang, LLVM, GTK 4, WebKitGTK, GStreamer and Xvfb
        if: steps.changes.outputs.visual == 'true'
        run: |
          mkdir -p ~/apt-archives/partial
          # shellcheck disable=SC2086 # one word per package
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            $APT_PACKAGES
          # Drops the files of versions the mirror no longer has, so the entry does not grow with every update.
          sudo apt-get autoclean -qq -o Dir::Cache::Archives="$HOME/apt-archives"
          # apt wrote them as root; the cache saves them as this user.
          sudo chown -R "$USER" ~/apt-archives
      - name: Install the pinned toolchain
        if: steps.changes.outputs.visual == 'true'
        run: rustup toolchain install
      - name: Add the web target
        if: matrix.host == 'web' && steps.changes.outputs.visual == 'true'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.visual == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: visual-${{ matrix.host }}
      # The CLI at the NSH revision the library is pinned to (root `Cargo.toml`), so the hosts are built from the
      # same NSH as the library. `cargo install` rebuilds it when the revision changes.
      - name: Install the nsh CLI at the pinned NSH revision
        if: steps.changes.outputs.visual == 'true'
        run: |
          rev=$(grep -m1 -o 'rev = "[0-9a-f]*"' Cargo.toml | cut -d'"' -f2)
          test -n "$rev"
          cargo install --git https://github.com/longbridge/nsh --rev "$rev" --locked --debug nsh-cli
        env:
          # NSH's own code is built here, not linted: its warnings are not this repository's. The `check` job of
          # `ci.yml` lints this repository's code with `-D warnings`.
          RUSTFLAGS: ""
      - name: Take the screenshots
        if: steps.changes.outputs.visual == 'true'
        run: |
          mkdir -p target/visual
          if [ "${{ matrix.host }}" = linux ]; then
            # The screen holds the catalog's window (2608 x 2784 points, `catalog::grid::viewport`); xvfb-run's
            # default screen is smaller, and a window larger than its screen shows only part of the catalog.
            dbus-run-session -- xvfb-run -a -s "-screen 0 2800x2900x24" nsh test examples/catalog/button.test.tsx --target linux
            dbus-run-session -- xvfb-run -a -s "-screen 0 2800x2900x24" nsh test examples/catalog/switch.test.tsx --target linux
            # The checkboxes' window is taller (`catalog::checkbox::viewport`): it has its own, larger screen.
            dbus-run-session -- xvfb-run -a -s "-screen 0 2800x4000x24" nsh test examples/catalog/checkbox.test.tsx --target linux
            # The FABs' window is taller still (`catalog::fab::viewport`).
            dbus-run-session -- xvfb-run -a -s "-screen 0 2800x4000x24" nsh test examples/catalog/fab.test.tsx --target linux
            # The cards' window is taller again (`catalog::card::viewport`).
            dbus-run-session -- xvfb-run -a -s "-screen 0 2800x4000x24" nsh test examples/catalog/card.test.tsx --target linux
          else
            nsh test examples/catalog/button.test.tsx --target web
            nsh test examples/catalog/switch.test.tsx --target web
            nsh test examples/catalog/checkbox.test.tsx --target web
            nsh test examples/catalog/fab.test.tsx --target web
            nsh test examples/catalog/card.test.tsx --target web
          fi
        env:
          RUSTFLAGS: ""
      - name: Check the screenshots' known pixels
        if: steps.changes.outputs.visual == 'true'
        run: cargo run -p visual-checks --locked -- target/visual
      - name: Keep the screenshots
        if: always() && steps.changes.outputs.visual == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.host }}
          path: target/visual/
          if-no-files-found: error

name: Visual checks on phones

# ADR 0013: the catalog on NSH's phone hosts, the iOS simulator and the Android emulator, which NSH's own CI does not
# run. `nsh test` opens `examples/catalog` on the device and saves a screenshot of each appearance
# (`examples/catalog/phone.test.tsx`); they are kept as artifacts, for review.
#
# The CLI is built from an NSH checkout at the pinned revision, not installed: on a phone, a Rust app's host is
# built with NSH's prebuilt runtime (the iOS host's frameworks, Android's Java runtime), which the CLI builds from
# the checkout it runs from (`crates/nsh-cli/src/runtime.rs` in NSH).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run on the older commit, which nobody needs any more. Each run on `main`
# has a group of its own, so a merge never cancels the run of the merge before it: every commit on `main` is
# checked, and its caches are saved.
concurrency:
  group: visual-phone-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # As in `visual.yml`: the hosts build faster and fit the runner's disk without debug information.
  CARGO_PROFILE_DEV_DEBUG: 0
  # NSH's own code is built here, not linted (as in `visual.yml`).
  RUSTFLAGS: ""

jobs:
  ios:
    name: visual (ios)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base: what the pull request changes.
          fetch-depth: 2
      # The job runs on every pull request, so that its check can be required, but it does its work only when the
      # pull request changes what the screenshots show; otherwise it passes at once. On `main` and by hand, always.
      # `--no-renames` lists a moved file by its old path too, so moving one out of these paths still counts.
      - name: See whether the pull request changes what the screenshots show
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only HEAD^1 HEAD | grep -E \
              '^(crates/|examples/|tests/visual/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/visual-phone\.yml$)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the screenshots show changes: no screenshot to take."
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the pinned NSH revision
        if: steps.changes.outputs.visual == 'true'
        id: nsh
        run: |
          rev=$(grep -m1 -o 'rev = "[0-9a-f]*"' Cargo.toml | cut -d'"' -f2)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.visual == 'true'
        with:
          repository: longbridge/nsh
          ref: ${{ steps.nsh.outputs.rev }}
          path: .nsh-src
      - name: Install the pinned toolchain and the simulator's target
        if: steps.changes.outputs.visual == 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.visual == 'true'
        with:
          key: visual-ios
          workspaces: |
            . -> target
            .nsh-src -> target
      - name: Build the nsh CLI at the pinned NSH revision
        if: steps.changes.outputs.visual == 'true'
        working-directory: .nsh-src
        run: cargo build -p nsh-cli --locked
      - name: Take the screenshots
        if: steps.changes.outputs.visual == 'true'
        run: |
          mkdir -p target/visual
          .nsh-src/target/debug/nsh test examples/catalog/phone.test.tsx --target ios
      - name: Keep the screenshots
        if: always() && steps.changes.outputs.visual == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-ios
          path: target/visual/
          if-no-files-found: error

  android:
    name: visual (android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base: what the pull request changes.
          fetch-depth: 2
      # The job runs on every pull request, so that its check can be required, but it does its work only when the
      # pull request changes what the screenshots show; otherwise it passes at once. On `main` and by hand, always.
      # `--no-renames` lists a moved file by its old path too, so moving one out of these paths still counts.
      - name: See whether the pull request changes what the screenshots show
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only HEAD^1 HEAD | grep -E \
              '^(crates/|examples/|tests/visual/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/visual-phone\.yml$)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the screenshots show changes: no screenshot to take."
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the pinned NSH revision
        if: steps.changes.outputs.visual == 'true'
        id: nsh
        run: |
          rev=$(grep -m1 -o 'rev = "[0-9a-f]*"' Cargo.toml | cut -d'"' -f2)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.visual == 'true'
        with:
          repository: longbridge/nsh
          ref: ${{ steps.nsh.outputs.rev }}
          path: .nsh-src
      # apt's downloads are kept between runs, as in `visual.yml`: Azure's Ubuntu mirror sometimes serves them at
      # about 50 kB/s.
      - name: Read the runner image's version
        id: image
        if: steps.changes.outputs.visual == 'true'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore apt's downloaded packages
        if: steps.changes.outputs.visual == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-visual-android-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/visual-phone.yml') }}
      # As NSH's release workflow builds the Android runtime: clang for QuickJS, Java 17 (`javac`, `d8`), the SDK's
      # `platforms;android-35` and the image's NDK.
      - name: Install clang
        if: steps.changes.outputs.visual == 'true'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            clang llvm libclang-dev
          # apt wrote them as root; the cache saves them as this user.
          sudo chown -R "$USER" ~/apt-archives
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.visual == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android platform
        if: steps.changes.outputs.visual == 'true'
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/ndk"
      # The emulator needs hardware acceleration, which GitHub's Linux runners give through KVM.
      - name: Let the emulator use KVM
        if: steps.changes.outputs.visual == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The catalog's library is built for every ABI of NSH's Android runtime (`ABIS` in `crates/xtask/src/android.rs`),
      # not only the emulator's.
      - name: Install the pinned toolchain and the Android targets
        if: steps.changes.outputs.visual == 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.visual == 'true'
        with:
          key: visual-android
          workspaces: |
            . -> target
            .nsh-src -> target
      - name: Build the nsh CLI at the pinned NSH revision
        if: steps.changes.outputs.visual == 'true'
        working-directory: .nsh-src
        run: cargo build -p nsh-cli --locked
      # NSH's build of its Android runtime gives bindgen the NDK's C headers with `-isystem` when the NDK has no
      # libclang (`ndk_cargo` in `crates/xtask/src/android.rs`), as the image's NDKs do: bindgen then runs on the
      # machine's libclang, whose own clang headers are another build's, and QuickJS's bindings fail
      # (`unknown type name 'uint32_t'` in the NDK's `pthread_types.h`). The same arguments with the NDK's headers as
      # libclang's resource directory build. bindgen reads `BINDGEN_EXTRA_CLANG_ARGS_<target>` with the target's
      # dashes before the underscored name NSH sets, so this takes their place; the shell cannot name such a variable,
      # hence `env`.
      - name: Give bindgen the NDK's clang headers as its resource directory
        if: steps.changes.outputs.visual == 'true'
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          resource=$(ls -d "$toolchain"/lib/clang/* | head -1)
          test -d "$resource/include"
          wrapper="$RUNNER_TEMP/with-ndk-bindgen"
          {
            echo '#!/bin/sh'
            echo 'exec env \'
            for pair in aarch64-linux-android:aarch64-linux-android armv7-linux-androideabi:armv7a-linux-androideabi \
                x86_64-linux-android:x86_64-linux-android; do
              # 28: NSH's minimum Android SDK (`MIN_SDK` in `crates/xtask/src/android.rs`).
              echo "  'BINDGEN_EXTRA_CLANG_ARGS_${pair%%:*}=--target=${pair##*:}28 --sysroot=$toolchain/sysroot -resource-dir $resource' \\"
            done
            echo '  "$@"'
          } > "$wrapper"
          chmod +x "$wrapper"
          cat "$wrapper"
          echo "WITH_NDK_BINDGEN=$wrapper" >> "$GITHUB_ENV"
      - name: Take the screenshots
        if: steps.changes.outputs.visual == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: mkdir -p target/visual && "$WITH_NDK_BINDGEN" .nsh-src/target/debug/nsh test examples/catalog/phone.test.tsx --target android
      - name: Keep the screenshots
        if: always() && steps.changes.outputs.visual == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-android
          path: target/visual/
          if-no-files-found: error

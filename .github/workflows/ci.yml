name: CI

on:
  pull_request:
  push:
    branches: [main]
  # To run CI by hand on any branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run on the older commit, which nobody needs any more. Each run on `main`
# has a group of its own, so a merge never cancels the run of the merge before it: every commit on `main` is
# checked, and its caches are saved.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug information: each build compiles, links and caches less. Panics still name their file and line, and it
  # changes no code that runs.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings
  # The property tests (`proptest`, ADR 0005) run the same cases on every run, as the user decided on 2026-11-06:
  # a red run is the code's, never the draw's, and reproduces with the same two variables. 256 is proptest's own
  # default number of cases, written here so it cannot change with a proptest release; the seed is any fixed value.
  # Locally, without them, each run draws new cases.
  PROPTEST_CASES: 256
  PROPTEST_RNG_SEED: 20261106

jobs:
  # Sorts what a pull request changes, so that one changing only documentation does not take a runner for each check:
  # the jobs that need `changes` then skip, and GitHub counts a skipped job as passed, required or not. The checks
  # that read documentation too (spelling, licenses) do not need it and always run, and everything runs on `main` and
  # by hand. The jobs test `!= 'false'`, so a failure here makes them all run rather than skip.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.sort.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: what the pull request changes.
          fetch-depth: 2
      - name: See whether the pull request changes more than documentation
        id: sort
        env:
          EVENT: ${{ github.event_name }}
          # Read by no build, test, proof or tool but typos and reuse. `.claude/` and `reference/` are not in it: some
          # repositories check them against a pinned source.
          DOCS: '^(docs/|LICENSES/|[^/]+\.md$|\.github/CODEOWNERS$|\.github/pull_request_template\.md$)'
        # `--no-renames` lists a moved file by its old path too, so moving one out of the code still counts.
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! grep -qvE "$DOCS" <<< "$changed"; then
            echo "Only documentation changes: the checks of the code skip."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only `main` saves: pull requests read its entries and cannot share theirs, so their saves only took
          # space from `main`'s under the repository's cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Vendored androidx tokens match the pinned androidx commit
        run: scripts/sync-androidx.sh check
      - name: Generated tokens match the vendored androidx files
        run: cargo xtask gen-tokens --check
      - name: Vendored Material Symbols match the pinned commit
        run: scripts/sync-material-symbols.sh check
      - name: Generated icons match the vendored Material Symbols
        run: cargo xtask gen-icons --check
      - name: Vendored Material Web elevation matches the pinned commit
        run: scripts/sync-material-web.sh check
      - name: NSH skills match the pinned NSH commit
        run: scripts/sync-nsh.sh check

  # ADR 0005: a mutant that survives the tests means a test that asserts too little, and fails the check.
  # The mutants are split into four shards that run side by side, each on its own runner: one runner took 19 to 22
  # minutes for the whole set. `--in-place` mutates this checkout instead of a copy, so the build reuses the `target/`
  # that rust-cache restored (a copy starts from an empty `target/`). Every shard runs the same command with the same
  # denominator, so together they test every mutant exactly once (cargo-mutants' `--shard k/n`). `round-robin` deals
  # the mutants out one by one: the default, `slice`, gave each shard a run of consecutive mutants, which took from 4
  # to 25 minutes depending on the files they fell in.
  mutants-shard:
    name: mutants shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the mutants the others miss.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutation testing
        run: cargo mutants --workspace --cargo-arg=--locked --in-place --sharding round-robin --shard ${{ matrix.shard }}/4

  # The required check: green only when every shard is. `always()` makes it run, and fail, when a shard fails or is
  # cancelled; without it, it would be skipped, and a skipped required check counts as passed.
  mutants:
    name: mutants
    needs: [changes, mutants-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.mutants-shard.result }}
        # The shards skip, and this passes, only when `changes` found nothing but documentation.
        run: |
          echo "The shards' result: $RESULT"
          if [ "$CODE" = false ] && [ "$RESULT" = skipped ]; then
            echo "Only documentation changes: no shard to run."
            exit 0
          fi
          test "$RESULT" = success

  deny:
    name: deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

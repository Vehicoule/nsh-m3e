[workspace]
resolver = "3"
members = ["crates/*", "examples/catalog", "tests/visual", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/Vehicoule/nsh-m3e"
license = "MPL-2.0"
publish = false

# Every dependency is declared here once; crates write `.workspace = true`.
# Adding one needs a one-line justification in the pull request (AGENTS.md rule 11).
[workspace.dependencies]
# NSH follows its `main` branch, pinned to one commit and bumped daily by
# `.github/workflows/nsh-bump.yml` (ADR 0006). Its crates always share the same `rev`, and `version` is NSH's version
# at that `rev`, so `cargo deny` does not take them for wildcards (ADR 0009); `scripts/sync-nsh.sh` keeps both.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", version = "0.4.0" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", version = "0.4.0", default-features = false }
# NSH's headless engine and test driver, for the animation measurements of ADR 0010. Test-only, without default
# features: no network client, no JavaScript runtime.
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", version = "0.4.0", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", version = "0.4.0", default-features = false }
# The library and the catalog app, for the visual checks (ADR 0013).
nsh-m3e = { path = "crates/nsh-m3e", version = "0.0.0" }
catalog = { path = "examples/catalog", version = "0.0.0" }
# Reads the screenshots of the visual checks (ADR 0013): pure Rust, decoding only. `image` was the alternative; it
# decodes many formats and pulls in far more.
png = { version = "0.18.1", default-features = false }
# Property tests on token logic (ADR 0005). Test-only; without the default `fork` and `timeout` features, which
# pull in process and temp-file crates the tests do not need.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# No panics in library code (AGENTS.md rule 9).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# No debugging leftovers.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Lints must be silenced with a reason that the compiler checks.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Floats: design values are compared with a tolerance, never with ==.
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
# Clarity.
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"

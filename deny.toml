# cargo-deny: run in CI on every pull request (`cargo deny check`).

[graph]
all-features = true

[advisories]
# Any known vulnerability or unmaintained crate fails the check.
yanked = "deny"

[licenses]
# Licenses compatible with distributing the app under GPL-3.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# NSH is used from its repository, pinned by revision (ADR 0006).
allow-git = ["https://github.com/longbridge/nsh"]

[licenses.private]
# The workspace's own crates are not published; their license is the repository's.
ignore = true
